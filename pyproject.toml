[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llmdyno"
dynamic = ["version"]
description = "Benchmark local and cloud LLMs as coding agents, from a web dashboard, a Python library or the command line: VRAM fit checks, sandboxed harnesses, hidden tests and LLM judges."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.11"
authors = [{ name = "speak2jerome", email = "speak2jerome@gmail.com" }]
keywords = [
  "llm", "benchmark", "coding-agent", "llama.cpp", "gguf", "local-llm", "vram", "llm-as-a-judge", "evaluation",
  "openai", "anthropic", "claude", "gemini", "qwen", "gemma", "deepseek", "opencode", "codex", "aider", "swe-agent",
  "swe-bench", "aider-polyglot", "artificial-analysis", "apple-silicon", "arm64", "metal", "python-library", "sdk",
  "cli", "llm-evaluation", "agent-benchmark", "mlflow", "wandb", "langfuse", "opentelemetry", "litellm", "ollama",
  "langgraph", "pytest", "inspect-ai", "huggingface", "jupyter",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: Jupyter",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Benchmark",
  "Typing :: Typed",
]

dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "pydantic==2.10.4",
  "httpx==0.28.1",
  "psutil==6.1.1",
  "python-multipart==0.0.20",
]

[project.urls]
Homepage = "https://github.com/speak2jerome/llmdyno"
Documentation = "https://speak2jerome.github.io/llmdyno/"
Changelog = "https://github.com/speak2jerome/llmdyno/blob/main/CHANGELOG.md"
Issues = "https://github.com/speak2jerome/llmdyno/issues"

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4"]
# Integrations are optional; each import is lazy and a missing extra says what to install.
pandas = ["pandas>=2.0"]
data = ["pandas>=2.0", "polars>=1.0", "pyarrow>=15"]
notebook = ["ipywidgets>=8.1", "rich>=13.7", "tqdm>=4.66"]
plot = ["matplotlib>=3.8", "plotly>=5.20"]
mlflow = ["mlflow-skinny>=2.12"]
wandb = ["wandb>=0.17"]
langfuse = ["langfuse>=3.0"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
litellm = ["litellm>=1.40"]
hub = ["huggingface_hub>=0.23", "pyarrow>=15"]
inspect = ["inspect-ai>=0.3.60"]
all = ["llmdyno[data,notebook,plot,mlflow,wandb,langfuse,otel,litellm,hub,inspect]"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
typing = ["pyright>=1.1.380"]
notebooks = ["nbmake>=1.5", "ipykernel>=6.29"]

[project.scripts]
llmdyno = "llmdyno.cli:main"

[project.entry-points.pytest11]
llmdyno = "llmdyno.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["llmdyno"]

[tool.hatch.version]
path = "llmdyno/__init__.py"

[tool.pyright]
# The public library (llmdyno/sdk, llmdyno/errors.py) is checked in strict mode by a header comment in each file, with
# the four "unknown type" rules relaxed: API results are JSON, dynamic by nature. Signatures there are fully typed.
# The services, web API, CLI, integrations and remote-access code are checked in standard mode.
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["llmdyno/sdk", "llmdyno/errors.py", "llmdyno/services", "llmdyno/api", "llmdyno/integrations",
           "llmdyno/auth.py", "llmdyno/cli.py", "llmdyno/lib.py", "llmdyno/aio.py", "llmdyno/__init__.py",
           "llmdyno/pytest_plugin.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
# benchmark tasks (starter code, reference solutions, graders) are fixtures, not project code
extend-exclude = ["llmdyno/benchmarks/builtin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
