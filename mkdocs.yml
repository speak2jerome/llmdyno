site_name: LLMDyno
site_description: Benchmark local and cloud LLMs as coding agents, from a web dashboard, Python, TypeScript or the command line.
site_author: Jerome Eliezer
site_url: https://speak2jerome.github.io/llmdyno/
repo_url: https://github.com/speak2jerome/llmdyno
repo_name: speak2jerome/llmdyno
edit_uri: edit/main/docs/
copyright: >-
  MIT License · <a href="https://zynxtech.in/projects/llmdyno/">LLMDyno</a> is part of
  <a href="https://zynxtech.in/">Zynxtech open source</a>, by <a href="https://zynxtech.in/about/">Jerome Eliezer</a>
exclude_docs: |
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  logo: images/logo.svg
  favicon: images/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/weather-night, name: Dark theme}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/weather-sunny, name: Light theme}
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Guides:
      - Python library and CLI: LIBRARY.md
      - Integrations: INTEGRATIONS.md
      - Remote mode: REMOTE.md
      - JavaScript and TypeScript: JAVASCRIPT.md
      - Benchmarks: BENCHMARKS.md
      - Harnesses: HARNESSES.md
  - API reference:
      - Overview: reference/index.md
      - Setup, system and jobs: reference/system.md
      - Profiles: reference/profiles.md
      - Models: reference/models.md
      - Providers: reference/providers.md
      - Harnesses and agents: reference/harnesses.md
      - Benchmarks and suites: reference/benchmarks.md
      - Plans: reference/plans.md
      - Runs and transcripts: reference/runs.md
      - Results: reference/results.md
      - Judging: reference/judging.md
      - Live events and async: reference/live.md
      - Remote mode: reference/remote.md
      - Settings and references: reference/settings.md
      - Interop and CI: reference/interop.md
      - Errors: reference/errors.md
  - Project:
      - Architecture: ARCHITECTURE.md
      - Releasing: RELEASING.md

hooks:
  - scripts/mkdocs_seo.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            filters: ["!^_", "!^PENDING_ROUTES$"]
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            docstring_style: google
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite

extra:
  home_title: "LLMDyno: benchmark local and cloud LLMs as coding agents"
  social:
    - icon: fontawesome/solid/globe
      link: https://zynxtech.in/projects/llmdyno/
      name: LLMDyno at Zynxtech
    - icon: fontawesome/brands/github
      link: https://github.com/speak2jerome/llmdyno
      name: Source on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/llmdyno/
      name: Python package on PyPI
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/llmdyno
      name: npm package
  # Search engine ownership checks. Paste the content value of the meta tag that Google Search Console or Bing
  # Webmaster Tools gives you; empty means no tag.
  google_site_verification: "voiK2NTjkdsh3st85sjbaF-VugDd_sH2VOiPqiO6G7s"
  bing_site_verification: ""
  # Meta descriptions, keyed by the file's path inside docs/. The home page uses site_description.
  page_descriptions:
    LIBRARY.md: >-
      Use LLMDyno from Python or the command line: describe models, run coding-agent benchmarks, read transcripts and
      compare results. Install with pip install llmdyno.
    INTEGRATIONS.md: >-
      Use LLMDyno with pandas, Jupyter, plotly, MLflow, Weights & Biases, Langfuse, OpenTelemetry, LiteLLM, Ollama, the
      Hugging Face Hub, Inspect AI, pytest and your own agent.
    REMOTE.md: >-
      Run LLMDyno on the machine with the GPU and drive it from another computer through Python, the command line or a
      browser, protected by an access token.
    JAVASCRIPT.md: >-
      Use LLMDyno from JavaScript or TypeScript: npx llmdyno starts it, the llmdyno npm package drives it, and
      node_harness benchmarks your own Vercel AI SDK, Mastra or LangChain.js agent.
    BENCHMARKS.md: >-
      Write your own LLMDyno benchmark: a coding task with a prompt, starter files, hidden tests and a reference
      solution, graded in an offline Docker container.
    HARNESSES.md: >-
      Add an agent harness to LLMDyno, from the UI without code or as a Python adapter, and the rules every harness
      follows inside the offline sandbox.
    ARCHITECTURE.md: >-
      How LLMDyno is built: the run pipeline, VRAM projection, the data model, scoring, the Python SDK, the web API and
      remote access.
    RELEASING.md: >-
      How LLMDyno releases are made: version bump, CI on every platform, tag, GitHub release, PyPI upload and the docs
      site.
    reference/index.md: >-
      API reference for the llmdyno Python package, generated from the code. Every call is also a llmdyno command.
    reference/system.md: API reference for LLMDyno setup, system checks, GPU status, cleanup and background jobs.
    reference/profiles.md: API reference for LLMDyno model profiles, local llama.cpp settings, cloud models and VRAM fit.
    reference/models.md: API reference for finding, sizing and downloading GGUF models from Hugging Face with LLMDyno.
    reference/providers.md: API reference for LLMDyno cloud providers, API keys, spend limits, prices and local servers.
    reference/harnesses.md: >-
      API reference for LLMDyno agent harnesses, Docker images and benchmarking your own Python or TypeScript agent.
    reference/benchmarks.md: API reference for LLMDyno benchmarks and suites, custom tasks, SWE-bench and Aider polyglot.
    reference/plans.md: API reference for LLMDyno plans, the bench() call, progress, retries and budgets.
    reference/runs.md: API reference for LLMDyno runs, transcripts, workspace files, logs and GPU telemetry.
    reference/results.md: API reference for LLMDyno results, scores, exports, charts and tracking integrations.
    reference/judging.md: API reference for LLMDyno code review by LLM judges, rubrics and judge agreement.
    reference/live.md: API reference for LLMDyno live events, watch() and the async API.
    reference/remote.md: API reference for connecting the llmdyno library to a server on another machine.
    reference/settings.md: API reference for LLMDyno settings, tokens and Artificial Analysis reference numbers.
    reference/interop.md: API reference for LLMDyno interop with Inspect AI, pytest and CI regression checks.
    reference/errors.md: API reference for the errors the llmdyno library raises and what each one means.
