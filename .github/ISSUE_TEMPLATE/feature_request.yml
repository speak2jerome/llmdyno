name: Feature request
description: An idea that would make LLMDyno more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to measure or do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Setup and hardware, Models and memory fit, Profiles, Cloud providers, Harnesses, Benchmarks, Runs, Judging, Results dashboard, Other]
