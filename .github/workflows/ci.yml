name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows on ARM is new on GitHub's runners and some wheels lag behind; report it without blocking merges
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest        # Apple Silicon (GitHub retires numbered macOS images; latest keeps up)
            python: "3.12"
          - os: ubuntu-24.04-arm    # Linux on ARM64
            python: "3.12"
          - os: windows-11-arm      # Windows on ARM64
            python: "3.12"
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check llmdyno tests scripts
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke
        run: llmdyno --version
      - name: Platform detection
        run: python scripts/platform_probe.py

  extras:
    name: Integrations, typing, notebooks, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with every extra
        run: python -m pip install -e ".[dev,all,typing,notebooks,docs]"
      - name: Tests (integration tests run instead of skipping)
        run: python -m pytest -q
      - name: Type check
        run: pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')"
      - name: Notebooks
        run: python -m pytest --nbmake examples/notebooks -q -p no:llmdyno
      - name: Docs site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict
      - name: Package
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  javascript:
    name: JavaScript client on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install LLMDyno
        run: python -m pip install -e .
      - name: Generated operations are current
        run: python scripts/gen_js_client.py --check
      - name: Install, type check, build
        working-directory: js
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Unit tests
        working-directory: js
        env:
          LLMDYNO_TEST_PYTHON: python
        run: npm test
      - name: Against a live server with the bundled sample data
        run: |
          LLMDYNO_DATA="$RUNNER_TEMP/llmdyno-data" llmdyno serve --port 8799 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8799/api/health > /dev/null && break; sleep 1; done
          cd js && LLMDYNO_TEST_URL=http://127.0.0.1:8799 npm run test:live || (cat "$RUNNER_TEMP/server.log"; exit 1)
      - name: The packed package installs, imports and launches
        run: |
          cd js && npm pack --silent && cd ..
          mkdir -p "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/js/llmdyno-*.tgz
          node --input-type=module -e "import { connect, VERSION } from 'llmdyno'; if (typeof connect !== 'function') process.exit(1); console.log('llmdyno', VERSION);"
          LLMDYNO_LAUNCHER_DRY_RUN=1 LLMDYNO_PYTHON=python npx --no-install llmdyno doctor

  frontend:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Build
        run: npm run build
      - name: Built UI is committed
        run: test -f ../llmdyno/web/static/index.html
