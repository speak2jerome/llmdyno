name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('llmdyno/__init__.py').read()).group(1))")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match llmdyno/__init__.py ($VERSION)"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Test
        run: |
          python -m pip install -e ".[dev]" build
          python -m pytest -q
      - name: Build wheel and sdist
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from the changelog
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "LLMDyno $VERSION" --notes-file notes.md $PRE

  # PyPI, so `pip install llmdyno` works. Off until the repository variable PUBLISH_PYPI is "true" and PyPI has a
  # trusted publisher for this repository and workflow (pypi.org > your project or pending publisher > Publishing:
  # owner speak2jerome, repository llmdyno, workflow release.yml, environment pypi). No token is stored anywhere.
  pypi:
    needs: release
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # npm, so `npm install llmdyno` and `npx llmdyno` work. Off until the repository variable PUBLISH_NPM is "true".
  # After the first manual publish (docs/RELEASING.md), npmjs.com > llmdyno > Settings > Trusted publishing links this
  # workflow (owner speak2jerome, repository llmdyno, workflow release.yml, environment npm), so no token is stored.
  npm:
    needs: release
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Package version matches the tag
        run: test "v$(node -p "require('./js/package.json').version")" = "$GITHUB_REF_NAME"
      - name: Build and test
        working-directory: js
        run: |
          npm ci
          npm run build
          npm test
      - name: Publish with provenance
        working-directory: js
        run: |
          TAG=latest
          case "$GITHUB_REF_NAME" in *-*) TAG=next;; esac
          npm publish --access public --provenance --tag "$TAG"
